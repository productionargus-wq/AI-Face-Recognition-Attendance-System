services:
  # 1. FastAPI Multi-Tenant Backend Service
  - type: web
    name: argus-attendance-api
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: DATABASE_NAME
        value: argus_attendance_db
      - key: JWT_SECRET
        generateValue: true
      - key: SIMILARITY_THRESHOLD
        value: "0.65"

  # 2. React Vite Frontend Static Site
  - type: web
    name: argus-attendance-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://argus-attendance-api.onrender.com/api/v1"
