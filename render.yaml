services:
  # 1. FastAPI Multi-Tenant Backend Service
  - type: web
    name: argus-attendance-api
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: MONGODB_URI
        value: "mongodb+srv://salesargustech_db_user:12345@cluster0.nrulvqr.mongodb.net/ai-attendance-db?appName=Cluster0"
      - key: DATABASE_NAME
        value: "ai-attendance-db"
      - key: JWT_SECRET
        generateValue: true
      - key: SIMILARITY_THRESHOLD
        value: "0.55"

  # 2. React Vite Frontend Static Site
  - type: web
    name: argus-attendance-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
      - type: rewrite
        source: "/api/v1/*"
        destination: "https://argus-attendance-api.onrender.com/api/v1/*"
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://argus-attendance-api.onrender.com/api/v1"
